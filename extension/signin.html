<!doctype html>
<html lang="en" class="page" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>Sign in to TaskFlow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="page">
  <section class="signin">
    <img class="logo" src="icons/icon128.png" alt="" />
    <h1 id="heading">Sign in to TaskFlow</h1>
    <p id="blurb">Use the same Google account you use for the TaskFlow web app.</p>
    <button id="goBtn" class="btn btn-primary">Continue with Google</button>
    <p id="error" class="err hidden"></p>
    <p id="hint" class="hidden" style="font-size:11px;color:var(--text-3);word-break:break-all"></p>
  </section>
  <script type="module" src="signin.js"></script>
</body>
</html>
